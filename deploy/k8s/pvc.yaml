# Persistent storage for the Chroma vector DB. Survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cayden-chroma-data
  namespace: rehs-2026-chatbot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: <<STORAGE_CLASS>>
