# Public HTTPS entry point. cert-manager auto-issues the TLS cert into <<TLS_SECRET>>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cayden-chatbot
  namespace: rehs-2026-chatbot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: haproxy
  tls:
  - hosts: [cayden-rehs-chatbot.nrp-nautilus.io]
    secretName: cayden-rehs-chatbot-tls
  rules:
  - host: cayden-rehs-chatbot.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cayden-chatbot
            port: {number: 80}
