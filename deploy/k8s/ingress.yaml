# Public HTTPS entry point. cert-manager auto-issues the TLS cert into <<TLS_SECRET>>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot
  namespace: rehs-2026-chatbot
  annotations:
    cert-manager.io/cluster-issuer: <<CERT_ISSUER>>
spec:
  ingressClassName: <<INGRESS_CLASS>>
  tls:
  - hosts: [<<INGRESS_HOST>>]
    secretName: <<TLS_SECRET>>
  rules:
  - host: <<INGRESS_HOST>>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chatbot
            port: {number: 80}
