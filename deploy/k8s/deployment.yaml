# The chatbot pod: one Streamlit container, config from a ConfigMap, token from a
# Secret, and the Chroma DB on a PVC mounted at /app/chroma_db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cayden-chatbot
  namespace: rehs-2026-chatbot
spec:
  replicas: 1
  selector:
    matchLabels: {app: cayden-chatbot}
  template:
    metadata:
      labels: {app: cayden-chatbot}
    spec:
      containers:
      - name: streamlit
        image: ghcr.io/drcayden/rehs-chatbot:v0.2
        ports:
        - containerPort: 8501
        envFrom:
        - secretRef: {name: cayden-chatbot-llm-token}
        volumeMounts:
        - name: cayden-chroma
          mountPath: /app/chroma_db
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet: {path: /_stcore/health, port: 8501}
          initialDelaySeconds: 30
        readinessProbe:
          httpGet: {path: /_stcore/health, port: 8501}
          initialDelaySeconds: 5
      volumes:
      - name: cayden-chroma
        persistentVolumeClaim:
          claimName: cayden-chroma-data
